; ============================================================
; iptv-everyday 全局配置
; 注意：这里只放“行为参数”，绝不放任何具体 IPTV 源地址。
;      所有源由 scripts/discover_sources.py 在运行时发现。
; ============================================================

[general]
; 时区：所有时间戳、日志、M3U 头部均使用该时区
timezone = Asia/Shanghai
; 仓库地址（push_to_gitee.sh 在缺少 GITEE_REPO_URL 环境变量时回退使用）
gitee_repo_url = https://gitee.com/ywyw2020/iptv-everyday
; 订阅分支（最终 raw 直链用的分支名）
subscribe_branch = master
; 输出分组顺序与白名单（六类）
groups = 央视,卫视,国际,体育,纪录,少儿
; 通用请求超时（秒）与重试次数
request_timeout = 15
request_retries = 2
; 流媒体 https 证书经常自签/过期，验证时允许忽略 TLS 校验
verify_tls = false

[discover]
; query_mode = all    -> 每次运行执行全部查询词（默认，发现量最大）
; query_mode = rotate -> 每天轮换，只执行 queries_per_run 个查询词
query_mode = all
queries_per_run = 2
; 每个查询词最多翻页数（每页 100）
max_pages_per_query = 5
per_page = 100
; 单日新增仓库上限（防 API 限流）
max_new_repos_per_run = 50
; 单日新增播放列表上限
max_new_playlists_per_run = 300
; 单次运行最多调用多少次 git trees 接口（每个仓库 1 次）
max_tree_calls = 120
; 仓库级准入门槛
min_stars = 20
min_stars_fresh = 5
fresh_days = 7
max_repo_age_days = 90
; 每个仓库最多提取多少个播放列表文件
max_playlist_per_repo = 12
; 递归裂变
recursive_depth = 2
recursive_max_repos = 30
recursive_docs_per_repo = 4
; 限流保护
min_rate_limit = 100
max_wait_seconds = 300
; 连续触发限流最多休眠几次，超过即放弃本轮（防流水线被拖死）
max_rate_limit_retries = 2
; 搜索引擎兜底（失败必须静默跳过）
enable_search_engine = true
search_delay_seconds = 3
ddg_queries = iptv m3u github 自动更新|直播源 每日更新 site:github.com|iptv playlist auto update github

[fetch]
timeout = 10
retries = 2
workers = 8
; 单个播放列表文件解析出的流数量为 0 时视为抓取失败
min_streams = 1

[dedupe]
; 最终每个频道保留几条（多源容灾）
keep_per_channel = 3
; 去重阶段额外保留的候选数，用于抵消验证淘汰
extra_candidates = 2
; 归一化时剔除的 query 参数名（时间戳类）
strip_query_keys = t,ts,timestamp,_t,time,_time,start,starttime,ts_
; 明显是无效流的 URL 最小长度
min_url_length = 12

[validate]
; 并发线程数
workers = 20
; 第一层 HTTP 探测超时
http_timeout = 5
; 第二层 ffprobe 超时
ffprobe_timeout = 20
; 第三层 ffmpeg 试播时长与超时
ffmpeg_duration = 5
ffmpeg_timeout = 25
; 单条流最多重试次数（三层内部，不再额外重试）
retries = 0

[retire]
; 连续多少天流级验证失败 -> 移入墓地
failure_threshold = 7
; 墓地回访间隔（天）
graveyard_review_days = 30
; 仓库超过多少天无 push 视为 stale，不再参与发现层准入
repo_stale_days = 90
; 回访时至少解析出这么多条流才算复活
revive_min_streams = 1

[generate]
; EPG 节目单地址
epg_url = https://epg.pw/api/epg.xml
; 台标前缀（源里自带 tvg-logo 优先；为空则输出时不带 tvg-logo）
logo_base =
; 输出文件
output_m3u = output/iptv.m3u
output_txt = output/iptv.txt
; 最多输出多少个频道（0 = 不限制）
max_channels = 0

[push]
branch = master
commit_user = iptv-bot
commit_email = bot@local
